<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - ACWA Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', -apple-system, sans-serif; }
        body { background: #f5f0fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .profile-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(150, 120, 180, 0.1);
            padding: 40px;
            max-width: 560px;
            width: 100%;
        }
        .avatar {
            width: 80px;
            height: 80px;
            background: #bf92dd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            margin: 0 auto 16px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2d1a3d;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8e0ee;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            background: #faf8fc;
        }
        .form-group input:focus {
            border-color: #bf92dd;
            box-shadow: 0 0 0 4px rgba(191, 146, 221, 0.12);
        }
        .form-group input:disabled {
            background: #f0ecf4;
            cursor: not-allowed;
        }
        .btn-save {
            width: 100%;
            padding: 14px;
            background: #bf92dd;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-save:hover {
            background: #a875c7;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(191, 146, 221, 0.35);
        }
        .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }
        .message.success { display: block; background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .message.error { display: block; background: #fde8e8; color: #c0392b; border-left: 4px solid #c0392b; }
        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: #bf92dd;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { color: #a875c7; }
        .role-badge {
            display: inline-block;
            padding: 4px 16px;
            background: #bf92dd20;
            color: #bf92dd;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .profile-card { animation: fadeIn 0.6s ease; }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar"><i class="fas fa-user"></i></div>

        <h1 class="text-center text-xl font-bold text-[#2d1a3d]">Mon Profil</h1>
        <p class="text-center text-[#6a5a7a] text-sm">Gérez vos informations personnelles</p>

        <div id="message" class="message"></div>

        <div class="mt-6">
            <div class="form-group">
                <label>Nom</label>
                <input type="text" id="userName" disabled>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="userEmail" disabled>
            </div>
            <div class="form-group">
                <label>Rôle</label>
                <div id="userRole" class="role-badge">admin</div>
            </div>
        </div>

        <hr class="my-6 border-gray-100">

        <h2 class="text-sm font-bold text-[#2d1a3d] mb-4">🔑 Changer le mot de passe</h2>

        <form id="passwordForm" onsubmit="handleChangePassword(event)">
            <div class="form-group">
                <label>Mot de passe actuel</label>
                <input type="password" id="currentPassword" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>Nouveau mot de passe</label>
                <input type="password" id="newPassword" placeholder="••••••••" required minlength="6">
            </div>
            <div class="form-group">
                <label>Confirmer le nouveau mot de passe</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" class="btn-save" id="saveBtn">
                <i class="fas fa-save mr-2"></i> Mettre à jour
            </button>
        </form>

        <div class="text-center">
            <a href="index.html" class="back-link">← Retour au tableau de bord</a>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('acwa_user') || 'null');
        if (!user) window.location.href = 'login.html';

        document.getElementById('userName').value = user.name || 'Administrateur';
        document.getElementById('userEmail').value = user.email || 'admin@acwa.com';
        document.getElementById('userRole').textContent = user.role || 'admin';

        async function handleChangePassword(e) {
            e.preventDefault();

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const message = document.getElementById('message');
            const saveBtn = document.getElementById('saveBtn');

            message.className = 'message';

            if (newPassword.length < 6) {
                message.className = 'message error';
                message.textContent = '❌ Le nouveau mot de passe doit contenir au moins 6 caractères';
                return;
            }

            if (newPassword !== confirmPassword) {
                message.className = 'message error';
                message.textContent = '❌ Les mots de passe ne correspondent pas';
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> En cours...';

            try {
                const token = localStorage.getItem('acwa_token');
                if (!token) {
                    window.location.href = 'login.html';
                    return;
                }
                const response = await fetch('/api/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ currentPassword, newPassword })
                });
                const result = await response.json();

                if (response.status === 401 && result.error && result.error.includes('Session')) {
                    localStorage.removeItem('acwa_token');
                    localStorage.removeItem('acwa_user');
                    window.location.href = 'login.html';
                    return;
                }

                if (result.success) {
                    message.className = 'message success';
                    message.textContent = '✅ ' + result.message;
                    document.getElementById('passwordForm').reset();
                } else {
                    message.className = 'message error';
                    message.textContent = '❌ ' + (result.error || 'Erreur lors du changement');
                }
            } catch (error) {
                message.className = 'message error';
                message.textContent = '❌ Erreur de connexion au serveur';
            }

            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="fas fa-save mr-2"></i> Mettre à jour';
        }

        console.log('✅ Page de profil chargée');
        console.log('👤 Utilisateur:', user.email);
    </script>

</body>
</html>
