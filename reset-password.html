<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation - ACWA Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', -apple-system, sans-serif; }
        body {
            background: linear-gradient(135deg, #f8f4fc 0%, #f0e8f8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(150, 120, 180, 0.15);
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            animation: fadeIn 0.6s ease;
        }
        .reset-card .icon {
            width: 64px;
            height: 64px;
            background: #bf92dd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 1.8rem;
            color: white;
        }
        .reset-card h1 { text-align: center; font-size: 1.4rem; font-weight: 700; color: #2d1a3d; }
        .reset-card p { text-align: center; color: #6a5a7a; font-size: 0.9rem; margin-top: 4px; }
        .reset-card .form-group { margin-bottom: 20px; margin-top: 24px; }
        .reset-card .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2d1a3d;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }
        .reset-card .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8e0ee;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            background: #faf8fc;
        }
        .reset-card .form-group input:focus {
            border-color: #bf92dd;
            box-shadow: 0 0 0 4px rgba(191, 146, 221, 0.12);
        }
        .reset-card .btn-reset {
            width: 100%;
            padding: 14px;
            background: #bf92dd;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .reset-card .btn-reset:hover { background: #a875c7; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(191, 146, 221, 0.35); }
        .reset-card .btn-reset:disabled { opacity: 0.6; cursor: not-allowed; }
        .reset-card .message { padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; margin-top: 16px; display: none; }
        .reset-card .message.success { display: block; background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .reset-card .message.error { display: block; background: #fde8e8; color: #c0392b; border-left: 4px solid #c0392b; }
        .reset-card .footer { text-align: center; margin-top: 24px; font-size: 0.75rem; color: #a88ab8; }
        .reset-card .footer a { color: #bf92dd; text-decoration: none; font-weight: 600; }
        .reset-card .footer a:hover { color: #a875c7; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="reset-card">
        <div class="icon"><i class="fas fa-key"></i></div>
        <h1>Nouveau mot de passe</h1>
        <p>Entrez votre nouveau mot de passe ci-dessous</p>

        <div id="message" class="message"></div>

        <form id="resetForm" onsubmit="handleReset(event)">
            <div class="form-group">
                <label>Nouveau mot de passe</label>
                <input type="password" id="newPassword" placeholder="••••••••" required minlength="6">
            </div>
            <div class="form-group">
                <label>Confirmer le mot de passe</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" class="btn-reset" id="resetBtn">
                <i class="fas fa-save mr-2"></i> Réinitialiser
            </button>
        </form>

        <div class="footer">
            <a href="login.html">← Retour à la connexion</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('message').className = 'message error';
            document.getElementById('message').textContent = '❌ Token invalide ou manquant';
            document.getElementById('resetBtn').disabled = true;
        }

        async function handleReset(e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const message = document.getElementById('message');
            const resetBtn = document.getElementById('resetBtn');

            message.className = 'message';

            if (newPassword.length < 6) {
                message.className = 'message error';
                message.textContent = '❌ Le mot de passe doit contenir au moins 6 caractères';
                return;
            }

            if (newPassword !== confirmPassword) {
                message.className = 'message error';
                message.textContent = '❌ Les mots de passe ne correspondent pas';
                return;
            }

            resetBtn.disabled = true;
            resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Chargement...';

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const result = await response.json();

                if (result.success) {
                    message.className = 'message success';
                    message.textContent = '✅ ' + result.message + ' ! Vous allez être redirigé...';
                    resetBtn.disabled = true;
                    resetBtn.innerHTML = '<i class="fas fa-check mr-2"></i> Terminé';
                    setTimeout(() => { window.location.href = 'login.html'; }, 3000);
                } else {
                    message.className = 'message error';
                    message.textContent = '❌ ' + (result.error || 'Erreur lors de la réinitialisation');
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = '<i class="fas fa-save mr-2"></i> Réinitialiser';
                }
            } catch (error) {
                message.className = 'message error';
                message.textContent = '❌ Erreur de connexion au serveur';
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<i class="fas fa-save mr-2"></i> Réinitialiser';
            }
        }

        console.log('✅ Page de réinitialisation chargée');
        console.log('🔑 Token:', token);
    </script>

</body>
</html>
